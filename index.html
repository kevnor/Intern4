<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8b1e3f" />
    <meta
      name="description"
      content="Internsiden for Singsaker Studenterhjem: regi, oppgaver, beboere og administrasjon."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      // Keep in sync with src/app/providers/ThemeProvider.tsx.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#2a0e18' : '#8b1e3f');
      })();
    </script>
    <title>Internsiden – Singsaker Studenterhjem</title>
  </head>
  <body>
    <noscript>Du må aktivere JavaScript for å bruke Internsiden.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
